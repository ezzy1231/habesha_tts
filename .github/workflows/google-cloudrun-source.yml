name: 'Deploy Habesha TTS to Cloud Run'

on:
  push:
    branches:
      - 'release'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: 'habeshatts-493811'
  REGION: 'us-central1'
  SERVICE: 'habeshatts-backend'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/821537154823/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  DEPLOY_SERVICE_ACCOUNT: 'github-actions-deployer@habeshatts-493811.iam.gserviceaccount.com'
  FRONTEND_URL: '${{ vars.FRONTEND_URL }}'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.DEPLOY_SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --source . \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 1 \
            --min-instances 1 \
            --set-env-vars "NODE_ENV=production,FRONTEND_URL=${{ env.FRONTEND_URL }},TTS_OUTPUT_PATH=./public/audios,JWT_EXPIRES_IN=3d,BOT_STATE_DUAL_WRITE=false,BOT_STATE_ENABLED_REDIS=true,ADMIN_ALLOW_UNPROTECTED=false,COOKIE_SAMESITE=none,COOKIE_SECURE=true,CROSS_SITE_COOKIES=true,ENABLE_STREAMER_OTP=true,LEDGER_READ_FALLBACK=true,ENABLE_GEMINI_TTS=true,GEMINI_TTS_MODEL=gemini-2.5-pro-tts,GEMINI_TTS_AUDIO_ENCODING=MP3,GEMINI_TTS_VOICE=Puck" \
            --update-secrets="TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,JWT_SECRET=jwt-secret:latest,ADMIN_TOKEN=admin-token:latest,GEMINI_API_KEY=gemini-api-key:latest,DATABASE_URL=database-url:latest,REDIS_URL=redis-url:latest"

      - name: 'Finalize Runtime URLs'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")

          gcloud run services update ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --update-env-vars "BASE_URL=${SERVICE_URL},FRONTEND_URL=${{ env.FRONTEND_URL }}"

      - name: 'Show Deployment Status'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          
          echo "✅ Deployment complete!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "📱 Telegram webhook will auto-configure on startup"
          echo "📊 Logs: https://console.cloud.google.com/run/detail/${{ env.REGION }}/${{ env.SERVICE }}/logs?project=${{ env.PROJECT_ID }}"
